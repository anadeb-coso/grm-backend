# Taille max. d'un corps de requête accepté par nginx (pièces jointes multipart `/api/attachments/`,
# JSON de `/api/sync/push/`). Sans cette directive, nginx applique sa valeur par défaut de 1 Mo et
# répond `413 Request Entity Too Large` avant même que la requête n'atteigne Django.
#
# Sur Amazon Linux 2 (plateforme actuelle de l'environnement `grm-2-env`), seule la config nginx
# placée dans `.platform/nginx/` est appliquée : un fichier écrit dans `/etc/nginx/conf.d/` via
# `.ebextensions` (`files:`) est écrasé au déploiement par la config nginx de la plateforme.
#
# 20M = même plafond que DATA_UPLOAD_MAX_MEMORY_SIZE/FILE_UPLOAD_MAX_MEMORY_SIZE (grm/settings.py),
# au-dessus de MAX_ATTACHMENT_SIZE (15 Mo) pour que Django renvoie son propre message d'erreur.
client_max_body_size 20M;
