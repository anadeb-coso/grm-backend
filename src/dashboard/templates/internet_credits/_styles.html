<style>
    :root {
        --ic-green: #24c38b;
        --ic-green-dark: #1a9c6e;
        --ic-ink: #2f3a45;
        --ic-muted: #8a97a3;
        --ic-line: #edf1f3;
        --ic-red: #d0455a;
        --ic-orange: #b9740f;
    }
    .ic-page { display: flex; flex-direction: column; gap: 20px; }
    .ic-section {
        background: #fff; border: 1px solid var(--ic-line); border-radius: 16px;
        box-shadow: 0 6px 20px rgba(31, 45, 61, .06); padding: 16px 20px 20px;
    }
    .ic-section > header {
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
        gap: 10px; margin-bottom: 12px;
    }
    .ic-section > header h2 { font-size: 16px; font-weight: 800; color: var(--ic-ink); margin: 0; }
    .ic-muted { color: var(--ic-muted); }
    .ic-hint { font-size: 12px; color: var(--ic-muted); line-height: 1.5; }
    .ic-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .ic-actions .btn, .ic-section .btn { border-radius: 10px; font-weight: 700; }
    .btn-ic { background: var(--ic-green); border-color: var(--ic-green); color: #fff; }
    .btn-ic:hover { background: var(--ic-green-dark); border-color: var(--ic-green-dark); color: #fff; }
    .btn-ic-outline { background: #fff; border: 1px solid var(--ic-line); color: var(--ic-green-dark); }
    .btn-ic-outline:hover { background: var(--ic-green); color: #fff; }

    .ic-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    @media (max-width: 1200px) { .ic-stats { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 767px) { .ic-stats { grid-template-columns: repeat(2, 1fr); } }
    .ic-tile {
        background: #fff; border: 1px solid var(--ic-line); border-radius: 16px; padding: 16px;
        box-shadow: 0 6px 20px rgba(31, 45, 61, .06);
    }
    .ic-tile .ic-tile-value { font-size: 24px; font-weight: 800; color: var(--ic-ink); line-height: 1.1; }
    .ic-tile .ic-tile-label {
        font-size: 11.5px; color: var(--ic-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    }

    table.ic-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.ic-table th, table.ic-table td { padding: 9px 12px; text-align: left; vertical-align: top; }
    table.ic-table thead th {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--ic-muted); border-bottom: 2px solid var(--ic-line);
    }
    table.ic-table tbody tr + tr td { border-top: 1px solid var(--ic-line); }
    table.ic-table tbody tr:hover td { background: #f6faf8; }
    .ic-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .ic-badge.on { background: rgba(36,195,139,.14); color: var(--ic-green-dark); }
    .ic-badge.off { background: rgba(233,84,84,.12); color: var(--ic-red); }
    .ic-badge.warn { background: rgba(245,186,116,.2); color: var(--ic-orange); }
    .ic-progress { height: 6px; border-radius: 3px; background: var(--ic-line); overflow: hidden; margin-top: 4px; min-width: 90px; }
    .ic-progress > span { display: block; height: 100%; background: var(--ic-green); }
    .ic-signature { max-height: 46px; max-width: 150px; border: 1px solid var(--ic-line); border-radius: 6px; background: #fff; margin-top: 4px; }
    .ic-confirmation + .ic-confirmation { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--ic-line); }
    .ic-small { font-size: 11.5px; }
    .ic-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .ic-filters a {
        border: 1px solid var(--ic-line); border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
        font-weight: 700; color: var(--ic-ink); background: #fff;
    }
    .ic-filters a.active { background: var(--ic-green); border-color: var(--ic-green); color: #fff; }
    .ic-pad-wrapper { border: 1px dashed #b8c3ca; border-radius: 10px; background: #fff; position: relative; }
    .ic-pad-wrapper canvas { width: 100%; height: 170px; display: block; touch-action: none; cursor: crosshair; }
    .ic-pad-wrapper .ic-pad-clear { position: absolute; top: 6px; right: 8px; }
    .modal-content { border-radius: 16px; border: 0; }
</style>
